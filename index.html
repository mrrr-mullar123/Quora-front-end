<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07140d">

<title>Quora Bets</title>

<style>
:root{
  --bg:#06110b;
  --panel:#0b1d13;
  --panel2:#10281a;
  --line:#1c4930;
  --green:#20e879;
  --green2:#12b95c;
  --text:#f4fff8;
  --muted:#91a79a;
  --red:#ff5968;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button{
  font-family:inherit;
  cursor:pointer;
}

.app{
  max-width:1100px;
  margin:auto;
  padding-bottom:90px;
}

/* HEADER */

.header{
  height:65px;
  padding:0 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#071710;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:23px;
  font-weight:900;
}

.logo span{
  color:var(--green);
}

.header-right{
  display:flex;
  align-items:center;
  gap:8px;
}

.balance{
  background:#10291b;
  border:1px solid #28563a;
  color:white;
  padding:9px 12px;
  border-radius:11px;
  font-weight:800;
}

.avatar{
  width:40px;
  height:40px;
  border:none;
  border-radius:50%;
  background:var(--green);
  color:#03150b;
  font-weight:900;
}

/* HERO */

.hero{
  margin:14px;
  padding:23px;
  border:1px solid #245b3b;
  border-radius:21px;
  background:
    linear-gradient(
      135deg,
      #0b2416,
      #123b25,
      #092015
    );
}

.hero-tag{
  color:var(--green);
  font-size:11px;
  font-weight:900;
}

.hero h1{
  margin:9px 0;
  font-size:30px;
}

.hero p{
  color:#a5b8ad;
  line-height:1.5;
}

.hero-buttons{
  display:flex;
  gap:8px;
}

.btn{
  border:none;
  border-radius:11px;
  padding:12px 16px;
  background:var(--green);
  color:#03160b;
  font-weight:900;
}

.btn.secondary{
  background:#102a1c;
  color:white;
  border:1px solid #2a5a3c;
}

/* TOP TABS */

.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:0 14px 13px;
}

.tab{
  flex:0 0 auto;
  border:1px solid #1b412b;
  background:#0a1c12;
  color:#8da498;
  padding:10px 16px;
  border-radius:11px;
  font-weight:800;
}

.tab.active{
  background:var(--green);
  color:#03160b;
}

/* PAGES */

.page{
  display:none;
  padding:0 14px;
}

.page.active{
  display:block;
}

.title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:10px 0 12px;
}

.title h2{
  margin:0;
}

.muted{
  color:var(--muted);
  font-size:12px;
}

/* SPORTS FILTER */

.sports-filter{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:12px;
}

.sport-btn{
  flex:0 0 auto;
  background:#0a1d13;
  color:#91a79a;
  border:1px solid #1d442e;
  padding:10px 14px;
  border-radius:10px;
  font-weight:800;
}

.sport-btn.active{
  background:var(--green);
  color:#03160b;
}

/* MATCH */

.match{
  background:var(--panel);
  border:1px solid #1b412b;
  border-radius:16px;
  margin-bottom:10px;
  overflow:hidden;
}

.match-header{
  padding:10px 12px;
  border-bottom:1px solid #173526;
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:11px;
}

.match-body{
  padding:13px;
}

.teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:8px;
  align-items:center;
  margin-bottom:12px;
}

.team{
  font-weight:800;
}

.team.away{
  text-align:right;
}

.vs{
  color:var(--muted);
  font-size:10px;
}

.odds{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.odd{
  border:1px solid #28553a;
  background:#11291b;
  color:white;
  border-radius:10px;
  padding:9px 5px;
}

.odd small{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-bottom:3px;
}

.odd strong{
  color:var(--green);
}

.odd.selected{
  background:#14532d;
  border-color:var(--green);
  box-shadow:0 0 0 1px var(--green);
}

/* LOADING */

.loading,
.empty{
  padding:25px;
  text-align:center;
  background:var(--panel);
  border:1px solid #1b412b;
  border-radius:15px;
  color:var(--muted);
}

/* BET SLIP */

.betslip{
  margin-top:15px;
  background:#0b2015;
  border:1px solid #25563a;
  border-radius:17px;
  padding:15px;
}

.slip-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.slip-header h3{
  margin:0;
}

.badge{
  background:var(--green);
  color:#03160b;
  border-radius:20px;
  padding:4px 9px;
  font-size:11px;
  font-weight:900;
}

.pick{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #183829;
}

.pick-name{
  font-weight:800;
}

.pick-choice{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.pick-right{
  text-align:right;
}
