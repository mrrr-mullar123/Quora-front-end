<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quora Bets</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#07121c;
  color:#f5f8fa;
  min-height:100vh;
  padding-bottom:90px;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
}

/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:500;
  background:#101d29;
  border-bottom:1px solid #233442;
}

.header-inner{
  max-width:1250px;
  margin:auto;
  min-height:76px;
  padding:12px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:25px;
  font-weight:900;
  white-space:nowrap;
}

.logo-box{
  width:47px;
  height:47px;
  border-radius:13px;
  background:#9ee01a;
  color:#07121c;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:29px;
  font-weight:900;
}

.logo span{
  color:#9ee01a;
}

.header-buttons{
  display:flex;
  gap:9px;
}

.btn{
  border:none;
  border-radius:12px;
  padding:12px 19px;
  font-weight:800;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  background:#9ee01a;
  color:#07121c;
}

.btn-secondary{
  background:#1b2b38;
  color:#fff;
  border:1px solid #334654;
}

.user-bar{
  display:none;
  align-items:center;
  gap:10px;
}

.user-bar.show{
  display:flex;
}

.user-name{
  color:#9ee01a;
  font-weight:800;
}

/* ================= SPORTS ================= */

.sports{
  background:#142330;
  border-bottom:1px solid #263847;
  overflow-x:auto;
}

.sports-inner{
  max-width:1250px;
  margin:auto;
  display:flex;
  gap:4px;
  padding:0 14px;
}

.sport{
  min-width:105px;
  border:none;
  background:transparent;
  color:#8e9ba5;
  padding:14px 15px 13px;
  font-weight:800;
  font-size:15px;
  border-bottom:3px solid transparent;
}

.sport.active{
  color:#fff;
  border-bottom-color:#9ee01a;
}

.sport-icon{
  display:block;
  font-size:24px;
  margin-bottom:4px;
}

/* ================= SUBNAV ================= */

.subnav{
  background:#101d29;
  border-bottom:1px solid #233442;
  overflow-x:auto;
}

.subnav-inner{
  max-width:1250px;
  margin:auto;
  display:flex;
  gap:28px;
  padding:16px 20px 13px;
  white-space:nowrap;
}

.subnav-btn{
  border:none;
  background:transparent;
  color:#9ba7af;
  font-size:16px;
  font-weight:700;
  padding-bottom:7px;
  border-bottom:3px solid transparent;
}

.subnav-btn.active{
  color:#fff;
  border-bottom-color:#9ee01a;
}
