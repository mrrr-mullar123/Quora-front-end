<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Quora Bets</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#07110d;
  --panel:#0d1b15;
  --panel2:#11231b;
  --green:#16d66b;
  --text:#fff;
  --muted:#8fa79a;
  --border:#1d3428;
  --danger:#ff4d5f;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,input{font-family:inherit}

button{cursor:pointer}

.header{
  height:64px;
  background:#08150f;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:23px;
  font-weight:900;
}

.logo span{color:var(--green)}

.logo-mark{
  width:34px;
  height:34px;
  background:var(--green);
  color:#06100b;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.header-right{
  display:flex;
  align-items:center;
  gap:8px;
}

.balance{
  background:var(--panel);
  border:1px solid var(--border);
  padding:9px 13px;
  border-radius:8px;
  font-size:13px;
}

.balance strong{color:var(--green)}

.auth-btn{
  border:0;
  padding:10px 15px;
  border-radius:7px;
  font-weight:800;
  background:var(--green);
  color:#041008;
}

.logout{
  background:#16291f;
  color:#fff;
  border:1px solid var(--border);
}

.nav{
  background:#0b1913;
  border-bottom:1px solid var(--border);
  display:flex;
  overflow-x:auto;
}

.nav button{
  flex:1;
  min-width:110px;
  padding:15px 12px;
  border:0;
  background:transparent;
  color:var(--muted);
  font-weight:700;
  border-bottom:3px solid transparent;
}

.nav button.active{
  color:var(--green);
  border-bottom-color:var(--green);
}

.main{
  max-width:1400px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 370px;
  gap:18px;
  padding:18px;
}

.hero{
  background:
  radial-gradient(circle at 90% 20%,rgba(22,214,107,.18),transparent 35%),
  linear-gradient(135deg,#10251a,#09150f);
  border:1px solid var(--border);
  border-radius:12px;
  padding:24px;
  margin-bottom:16px;
}

.hero h1{
  font-size:27px;
  margin-bottom:7px;
}

.hero p{
  color:var(--muted);
  font-size:14px;
}

.search{
  margin-top:18px;
  display:flex;
  gap:8px;
}

.search input{
  flex:1;
  background:#07110d;
  border:1px solid var(--border);
  color:#fff;
  border-radius:7px;
  padding:12px;
  outline:0;
}

.search input:focus{border-color:var(--green)}

.refresh{
  border:0;
  background:var(--green);
  color:#041008;
  padding:0 17px;
  border-radius:7px;
  font-weight:800;
}

.status{
  padding:11px 14px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:8px;
  margin-bottom:15px;
  font-size:13px;
  color:var(--muted);
}

.status.ok{color:var(--green)}
.status.error{color:var(--danger)}

.league{
  margin-bottom:17px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
}

.league-header{
  padding:13px 15px;
  background:#102119;
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
}

.league-name{font-weight:800;font-size:14px}
.country{color:var(--muted);font-size:12px}

.game{
  padding:14px;
  border-bottom:1px solid var(--border);
}

.game:last-child{border-bottom:0}

.game-top{
  display:flex;
  justify-content:space-between;
  margin-bottom:12px;
}

.game-time{
  font-size:12px;
  color:var(--muted);
}

.live{
  color:var(--green);
  font-size:11px;
  font-weight:800;
}

.teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px;
  margin-bottom:13px;
}

.team{
  font-size:14px;
  font-weight:700;
}

.team.home{text-align:right}

.vs{
  color:var(--muted);
  font-size:11px;
}

.odds{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.odd{
  background:#16291f;
  border:1px solid #274235;
  color:#fff;
  min-height:50px;
  border-radius:6px;
}

.odd:hover{
  border-color:var(--green);
}

.odd.selected{
  background:var(--green);
  color:#041008;
}

.odd:disabled{
  opacity:.45;
}

.odd-label{
  display:block;
  font-size:11px;
  opacity:.75;
  margin-bottom:4px;
}

.odd-price{
  font-size:15px;
  font-weight:900;
}

/* BETSLIP */

.betslip{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  position:sticky;
  top:82px;
  height:max-content;
}

.betslip-title{
  background:#102119;
  padding:16px;
  font-weight:900;
  display:flex;
  justify-content:space-between;
}

.count{
  background:var(--green);
  color:#041008;
  border-radius:20px;
  padding:3px 8px;
  font-size:11px;
}

.bets{
  max-height:440px;
  overflow-y:auto;
}

.empty{
  padding:45px 20px;
  text-align:center;
  color:var(--muted);
}

.empty-icon{
  font-size:38px;
  margin-bottom:10px;
}

.bet{
  padding:14px;
  border-bottom:1px solid var(--border);
}

.bet-head{
  display:flex;
  justify-content:space-between;
}

.bet-match{
  font-size:13px;
  font-weight:700;
}

.remove{
  background:transparent;
  border:0;
  color:var(--danger);
  font-size:20px;
}

.bet-info{
  display:flex;
  justify-content:space-between;
  margin-top:9px;
  font-size:12px;
  color:var(--muted);
}

.bet-price{
  color:var(--green);
  font-weight:900;
}

.summary{
  padding:15px;
  border-top:1px solid var(--border);
}

.row{
  display:flex;
  justify-content:space-between;
  margin-bottom:12px;
  font-size:13px;
}

.row span:first-child{color:var(--muted)}

.total{
  font-size:16px;
  font-weight:900;
}

.total span:last-child{color:var(--green)}

.stake{
  width:100%;
  background:#07110d;
  border:1px solid var(--border);
  color:#fff;
  padding:13px;
  border-radius:7px;
  margin:5px 0 12px;
  outline:0;
}

.place{
  width:100%;
  padding:14px;
  background:var(--green);
  border:0;
  color:#041008;
  font-size:15px;
  font-weight:900;
  border-radius:7px;
}

.place:disabled{
  background:#26372e;
  color:#718178;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:1000;
}

.modal.show{display:flex}

.modal-box{
  width:100%;
  max-width:430px;
  background:#0d1b15;
  border:1px solid var(--border);
  border-radius:14px;
  padding:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-head h2{font-size:22px}

.close{
  background:transparent;
  border:0;
  color:#fff;
  font-size:25px;
}

.form-group{margin-bottom:13px}

.form-group label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:6px;
}

.form-group input{
  width:100%;
  padding:13px;
  background:#07110d;
  color:#fff;
  border:1px solid var(--border);
  border-radius:7px;
  outline:0;
}

.form-group input:focus{border-color:var(--green)}

.form-submit{
  width:100%;
  padding:14px;
  border:0;
  border-radius:7px;
  background:var(--green);
  color:#041008;
  font-weight:900;
  margin-top:5px;
}

.switch-auth{
  text-align:center;
  margin-top:15px;
  color:var(--muted);
  font-size:13px;
}

.switch-auth button{
  border:0;
  background:transparent;
  color:var(--green);
  font-weight:800;
}

.form-message{
  display:none;
  padding:10px;
  border-radius:7px;
  margin-bottom:12px;
  font-size:13px;
}

.form-message.error{
  display:block;
  background:rgba(255,77,95,.1);
  color:var(--danger);
}

.form-message.success{
  display:block;
  background:rgba(22,214,107,.1);
  color:var(--green);
}

.loading{
  padding:50px;
  text-align:center;
  color:var(--muted);
}

.spinner{
  width:35px;
  height:35px;
  border:3px solid #294034;
  border-top-color:var(--green);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 14px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* MOBILE */

@media(max-width:850px){

  .header{
    padding:0 12px;
  }

  .balance{
    display:none;
  }

  .main{
    display:block;
    padding:10px;
  }

  .hero{
    padding:18px;
  }

  .hero h1{
    font-size:22px;
  }

  .betslip{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    top:auto;
    z-index:200;
    border-radius:12px 12px 0 0;
  }

  .bets{
    max-height:260px;
  }

  .betslip.collapsed .bets,
  .betslip.collapsed .summary{
    display:none;
  }

  .betslip.collapsed .betslip-title{
    cursor:pointer;
  }

  body{
    padding-bottom:65px;
  }
}

@media(max-width:500px){

  .logo{
    font-size:19px;
  }

  .logo-mark{
    width:30px;
    height:30px;
  }

  .auth-btn{
    padding:8px 11px;
    font-size:12px;
  }

  .team{
    font-size:12px;
  }

  .odd{
    min-height:46px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    <div class="logo-mark">Q</div>
    QUORA <span>BETS</span>
  </div>

  <div class="header-right">

    <div class="balance">
      Balance: <strong>KES 0.00</strong>
    </div>

    <button id="authButton"
            class="auth-btn"
            onclick="openLogin()">
      Login
    </button>

  </div>

</header>


<nav class="nav">

  <button class="active"
          onclick="changeSport('soccer_epl',this)">
    ⚽ Football
  </button>

  <button onclick="changeSport('basketball_nba',this)">
    🏀 Basketball
  </button>

  <button onclick="changeSport('tennis_atp',this)">
    🎾 Tennis
  </button>

  <button onclick="changeSport('icehockey_nhl',this)">
    🏒 Hockey
  </button>

</nav>


<main class="main">

<section>

  <div class="hero">

    <h1>Bet on today's games</h1>

    <p>
      Real-time fixtures and odds powered by Quora Bets.
    </p>

    <div class="search">

      <input id="search"
             placeholder="Search teams..."
             oninput="renderGames()">

      <button class="refresh"
              onclick="loadOdds()">
        ↻ Refresh
      </button>

    </div>

  </div>

  <div id="status" class="status">
    Connecting to Quora Bets...
  </div>

  <div id="games">

    <div class="loading">
      <div class="spinner"></div>
      Loading games...
    </div>

  </div>

</section>


<aside id="betslip" class="betslip">

  <div class="betslip-title"
       onclick="toggleBetslip()">

    <span>Bet Slip</span>

    <span id="betCount"
          class="count">
      0
    </span>

  </div>

  <div id="bets" class="bets">

    <div class="empty">

      <div class="empty-icon">🧾</div>

      <div>Your bet slip is empty</div>

      <small>Click an odd to add it here</small>

    </div>

  </div>

  <div class="summary">

    <div class="row">
      <span>Total Odds</span>
      <strong id="totalOdds">0.00</strong>
    </div>

    <div class="row">
      <span>Stake</span>
      <strong>
        KES <span id="stakeDisplay">0.00</span>
      </strong>
    </div>

    <input id="stake"
           class="stake"
           type="number"
           min="0"
           placeholder="Enter stake (KES)"
           oninput="calculate()">

    <div class="row total">
      <span>Potential Win</span>
      <span>
        KES <span id="potential">0.00</span>
      </span>
    </div>

    <button id="placeBet"
            class="place"
            disabled
            onclick="placeBet()">
      PLACE BET
    </button>

  </div>

</aside>

</main>


<!-- AUTH MODAL -->

<div id="authModal"
     class="modal"
     onclick="closeModalOutside(event)">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="authTitle">Login</h2>

      <button class="close"
              onclick="closeAuth()">
        ×
      </button>

    </div>

    <div id="formMessage"
         class="form-message"></div>


    <!-- LOGIN -->

    <form id="loginForm"
          onsubmit="login(event)">

      <div class="form-group">

        <label>Email</label>

        <input id="loginEmail"
               type="email"
               required
               autocomplete="email"
               placeholder="Enter your email">

      </div>

      <div class="form-group">

        <label>Password</label>

        <input id="loginPassword"
               type="password"
               required
               autocomplete="current-password"
               placeholder="Enter your password">

      </div>

      <button class="form-submit">
        LOGIN
      </button>

    </form>


    <!-- REGISTER -->

    <form id="registerForm"
          style="display:none"
          onsubmit="register(event)">

      <div class="form-group">

        <label>Full Name</label>

        <input id="registerName"
               type="text"
               required
               placeholder="Your full name">

      </div>

      <div class="form-group">

        <label>Email</label>

        <input id="registerEmail"
               type="email"
               required
               placeholder="Your email">

      </div>

      <div class="form-group">

        <label>Phone</label>

        <input id="registerPhone"
               type="tel"
               required
               placeholder="e.g. 254712345678">

      </div>

      <div class="form-group">

        <label>Password</label>

        <input id="registerPassword"
               type="password"
               required
               minlength="6"
               placeholder="Create password">

      </div>

      <div class="form-group">

        <label>Confirm Password</label>

        <input id="registerConfirm"
               type="password"
               required
               minlength="6"
               placeholder="Confirm password">

      </div>

      <button class="form-submit">
        CREATE ACCOUNT
      </button>

    </form>


    <div class="switch-auth">

      <span id="switchText">
        Don't have an account?
      </span>

      <button id="switchButton"
              onclick="showRegister()">
        Register
      </button>

    </div>

  </div>

</div>


<script>

const API_BASE =
  "https://quora-bets-back-end1.onrender.com";

let currentSport = "soccer_epl";
let games = [];
let selections = [];


/* ================= AUTH UI ================= */

function openLogin(){

  const token =
    localStorage.getItem("quora_token");

  if(token){
    logout();
    return;
  }

  showLogin();

  document
    .getElementById("authModal")
    .classList.add("show");
}


function showLogin(){

  document.getElementById("authTitle")
    .textContent = "Login";

  document.getElementById("loginForm")
    .style.display = "block";

  document.getElementById("registerForm")
    .style.display = "none";

  document.getElementById("switchText")
    .textContent = "Don't have an account?";

  document.getElementById("switchButton")
    .textContent = "Register";

  document.getElementById("switchButton")
    .onclick = showRegister;

  clearMessage();
}


function showRegister(){

  document.getElementById("authTitle")
    .textContent = "Create Account";

  document.getElementById("loginForm")
    .style.display = "none";

  document.getElementById("registerForm")
    .style.display = "block";

  document.getElementById("switchText")
    .textContent = "Already have an account?";

  document.getElementById("switchButton")
    .textContent = "Login";

  document.getElementById("switchButton")
    .onclick = showLogin;

  clearMessage();
}


function closeAuth(){

  document
    .getElementById("authModal")
    .classList.remove("show");

  clearMessage();
}


function closeModalOutside(event){

  if(event.target.id === "authModal"){
    closeAuth();
  }
}


function setMessage(message,type){

  const box =
    document.getElementById("formMessage");

  box.textContent = message;
  box.className =
    "form-message " + type;
}


function clearMessage(){

  const box =
    document.getElementById("formMessage");

  box.textContent = "";
  box.className = "form-message";
}


/* ================= REGISTER ================= */

async function register(event){

  event.preventDefault();

  const name =
    document.getElementById("registerName")
      .value.trim();

  const email =
    document.getElementById("registerEmail")
      .value.trim();

  const phone =
    document.getElementById("registerPhone")
      .value.trim();

  const password =
    document.getElementById("registerPassword")
      .value;

  const confirm =
    document.getElementById("registerConfirm")
      .value;


  if(password !== confirm){

    setMessage(
      "Passwords do not match.",
      "error"
    );

    return;
  }


  if(password.length < 6){

    setMessage(
      "Password must be at least 6 characters.",
      "error"
    );

    return;
