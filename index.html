<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quora Bets</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #03150f;
      color: #f5fff9;
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #041810;
      border-bottom: 1px solid #17392b;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 28px;
      font-weight: 800;
      white-space: nowrap;
    }

    .logo-box {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: #16d968;
      color: #03150f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 900;
    }

    .logo span {
      color: #16d968;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 14px 22px;
      font-weight: 800;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-1px);
      opacity: .9;
    }

    .btn-primary {
      background: #16d968;
      color: #03150f;
    }

    .btn-secondary {
      background: #0a251a;
      color: white;
      border: 1px solid #214536;
    }

    /* SPORTS */
    .sports {
      border-bottom: 1px solid #17392b;
      overflow-x: auto;
      white-space: nowrap;
    }

    .sports-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      gap: 35px;
      padding: 15px 22px;
    }

    .sport {
      border: none;
      background: transparent;
      color: #92a99e;
      font-size: 20px;
      font-weight: 800;
      padding: 8px;
    }

    .sport.active {
      color: #16d968;
    }

    /* MAIN */
    main {
      max-width: 1200px;
      margin: auto;
      padding: 28px 18px 80px;
    }

    .hero {
      background: linear-gradient(135deg, #07351f, #061d14);
      border: 1px solid #1d4a35;
      border-radius: 25px;
      padding: 38px 32px;
      margin-bottom: 24px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #9aafa5;
      font-size: 20px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .search {
      width: 100%;
      padding: 20px;
      border-radius: 15px;
      border: 1px solid #234b3a;
      background: #02120d;
      color: white;
      outline: none;
      margin-bottom: 14px;
    }

    .search:focus {
      border-color: #16d968;
    }

    .refresh {
      width: 100%;
      padding: 18px;
      border-radius: 15px;
      border: none;
      background: #16d968;
      color: #03150f;
      font-weight: 900;
      font-size: 20px;
    }

    .refresh:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    /* STATUS */
    .status {
      padding: 18px 22px;
      border: 1px solid #1d4434;
      border-radius: 18px;
      margin-bottom: 24px;
      color: #16d968;
      background: #061b12;
    }

    .status.error {
      color: #ff7777;
    }

    .status.loading {
      color: #ffd86b;
    }

    /* MATCHES */
    .league {
      border: 1px solid #193d2e;
      border-radius: 20px;
      overflow: hidden;
      background: #061b12;
      margin-bottom: 22px;
    }

    .league-title {
      padding: 20px;
      border-bottom: 1px solid #193d2e;
      display: flex;
      justify-content: space-between;
      color: #dcebe4;
      font-weight: 800;
      font-size: 20px;
    }

    .match {
      padding: 22px;
      border-bottom: 1px solid #193d2e;
    }

    .match:last-child {
      border-bottom: none;
    }

    .match-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      color: #91a79e;
      margin-bottom: 18px;
    }

    .upcoming {
      color: #16d968;
      font-weight: 800;
    }

    .teams {
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .vs {
      color: #778c83;
      padding: 0 12px;
      font-weight: 500;
    }

    .odds {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .odd {
      background: #0b261a;
      color: white;
      border: 1px solid #28503e;
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
      transition: .2s;
    }

    .odd:hover {
      background: #103623;
      border-color: #16d968;
    }

    .odd-name {
      display: block;
      color: #b6c6bf;
      margin-bottom: 5px;
    }

    .odd-price {
      font-size: 20px;
      font-weight: 900;
      color: white;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #91a79e;
    }

    .empty h2 {
      margin-bottom: 10px;
      color: white;
    }

    /* BET SLIP */
    .slip {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 360px;
      max-width: calc(100% - 40px);
      background: #071d14;
      border: 1px solid #28503e;
      border-radius: 20px;
      z-index: 200;
      box-shadow: 0 15px 50px rgba(0,0,0,.45);
      display: none;
    }

    .slip.open {
      display: block;
    }

    .slip-header {
      padding: 18px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #193d2e;
      font-weight: 900;
    }

    .slip-count {
      background: #16d968;
      color: #03150f;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .slip-body {
      max-height: 350px;
      overflow-y: auto;
      padding: 15px;
    }

    .slip-item {
      background: #0b261a;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .slip-item strong {
      display: block;
      margin-bottom: 5px;
    }

    .slip-item small {
      color: #91a79e;
    }

    .remove {
      margin-top: 8px;
      border: none;
      background: transparent;
      color: #ff7777;
      font-size: 13px;
    }

    .slip-footer {
      border-top: 1px solid #193d2e;
      padding: 15px;
    }

    .slip-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      color: #a8bbb3;
    }

    .slip-row strong {
      color: white;
    }

    .slip-close {
      border: none;
      background: transparent;
      color: white;
      font-size: 18px;
    }

    /* MODAL */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0,0,0,.75);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 430px;
      background: #071d14;
      border: 1px solid #28503e;
      border-radius: 22px;
      padding: 25px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .modal-header h2 {
      font-size: 25px;
    }

    .close {
      border: none;
      background: transparent;
      color: white;
      font-size: 28px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #a8bbb3;
    }

    .form-group input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #28503e;
      background: #02120d;
      color: white;
      outline: none;
    }

    .form-group input:focus {
      border-color: #16d968;
    }

    .form-submit {
      width: 100%;
      margin-top: 8px;
    }

    .form-message {
      margin-top: 15px;
      color: #ff7777;
      text-align: center;
    }

    .user-bar {
      display: none;
      align-items: center;
      gap: 10px;
    }

    .user-bar.show {
      display: flex;
    }

    .user-name {
      color: #16d968;
      font-weight: 800;
    }

    /* MOBILE */
    @media(max-width: 700px) {
      .header-inner {
        padding: 15px;
      }

      .logo {
        font-size: 21px;
      }

      .logo-box {
        width: 48px;
        height: 48px;
        font-size: 28px;
      }

      .header-buttons .btn {
        padding: 12px 15px;
        font-size: 14px;
      }

      .hero {
        padding: 30px 20px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .hero p {
        font-size: 18px;
      }

      .sports-inner {
        gap: 18px;
      }

      .sport {
        font-size: 17px;
      }

      .odds {
        gap: 7px;
      }

      .odd {
        padding: 10px 4px;
      }

      .odd-name {
        font-size: 13px;
      }

      .odd-price {
        font-size: 17px;
      }

      .match {
        padding: 17px 12px;
      }

      .teams {
        font-size: 17px;
      }

      .slip {
        right: 10px;
        bottom: 10px;
        max-width: calc(100% - 20px);
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      <div class="logo-box">Q</div>
      <div>QUORA <span>BETS</span></div>
    </div>

    <div class="header-buttons" id="authButtons">
      <button class="btn btn-primary" id="loginBtn">Login</button>
      <button class="btn btn-secondary" id="registerBtn">Register</button>
    </div>

    <div class="user-bar" id="userBar">
      <span class="user-name" id="userName"></span>
      <button class="btn btn-secondary" id="logoutBtn">Logout</button>
    </div>

  </div>
</header>

<nav class="sports">
  <div class="sports-inner">

    <button class="sport active" data-sport="soccer_epl">
      ⚽ Football
    </button>

    <button class="sport" data-sport="basketball_nba">
      🏀 Basketball
    </button>

    <button class="sport" data-sport="tennis_atp_us_open">
      🎾 Tennis
    </button>

    <button class="sport" data-sport="icehockey_nhl">
      🏒 Hockey
    </button>

  </div>
</nav>

<main>

  <section class="hero">

    <h1>Bet on today's games</h1>

    <p>
      Real-time fixtures and odds powered by Quora Bets.
    </p>

    <input
      id="searchInput"
      class="search"
      type="search"
      placeholder="Search teams..."
      autocomplete="off"
    >

    <button class="refresh" id="refreshBtn">
      ↻ &nbsp; Refresh
    </button>

  </section>

  <div class="status loading" id="status">
    ● Connecting to Quora Bets...
  </div>

  <section id="gamesContainer">

    <div class="empty">
      <h2>Loading games...</h2>
      <p>Please wait while we connect to the odds service.</p>
    </div>

  </section>

</main>

<!-- BET SLIP BUTTON -->
<button
  id="slipFloating"
  class="btn btn-primary"
  style="
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:150;
    display:none;
  "
>
  Bet Slip (<span id="floatingCount">0</span>)
</button>

<!-- BET SLIP -->
<div class="slip" id="betSlip">

  <div class="slip-header">
    <span>Bet Slip</span>

    <div style="display:flex;align-items:center;gap:10px;">
      <span class="slip-count" id="slipCount">0</span>

      <button class="slip-close" id="closeSlip">

      </button>

  </div>

  <div class="slip-body" id="slipBody">

    <div class="empty" style="padding:30px 10px;">
      Your bet slip is empty.
    </div>

  </div>

  <div class="slip-footer">

    <div class="slip-row">
      <span>Total Odds</span>
      <strong id="totalOdds">0.00</strong>
    </div>

    <div class="slip-row">
      <span>Selections</span>
      <strong id="selectionCount">0</strong>
    </div>

    <button
      class="btn btn-primary"
      style="width:100%;"
      id="demoBetBtn"
    >
      Continue
    </button>

  </div>

</div>

<!-- LOGIN MODAL -->
<div class="modal" id="loginModal">

  <div class="modal-box">

    <div class="modal-header">
      <h2>Login</h2>

      <button class="close" data-close="loginModal">
        ×
      </button>
    </div>

    <form id="loginForm">

      <div class="form-group">
        <label>Email</label>
        <input
          id="loginEmail"
          type="email"
          required
          autocomplete="email"
          placeholder="you@example.com"
        >
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          id="loginPassword"
          type="password"
          required
          autocomplete="current-password"
          placeholder="Password"
        >
      </div>

      <button class="btn btn-primary form-submit" type="submit">
        Login
      </button>

      <div class="form-message" id="loginMessage"></div>

    </form>

  </div>

</div>

<!-- REGISTER MODAL -->
<div class="modal" id="registerModal">

  <div class="modal-box">

    <div class="modal-header">
      <h2>Create Account</h2>

      <button class="close" data-close="registerModal">
        ×
      </button>
    </div>

    <form id="registerForm">

      <div class="form-group">
        <label>Name</label>
        <input
          id="registerName"
          type="text"
          required
          placeholder="Your name"
        >
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          id="registerEmail"
          type="email"
          required
          autocomplete="email"
          placeholder="you@example.com"
        >
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input
          id="registerPhone"
          type="tel"
          required
          placeholder="0712345678"

        <label>Password</label>
        <input
          id="registerPassword"
          type="password"
          required
          minlength="8"
          autocomplete="new-password"
          placeholder="At least 8 characters"
        >
      </div>

      <button class="btn btn-primary form-submit" type="submit">
        Register
      </button>

      <div class="form-message" id="registerMessage"></div>

    </form>

  </div>

</div>


<script>

/* =========================================================
   QUORA BETS FRONTEND
   ========================================================= */

const API_BASE = "https://quora-bets-back-end1.onrender.com";

/*
  We deliberately use a timeout so the page NEVER stays
  permanently on "Loading games..."
*/
const REQUEST_TIMEOUT = 30000;

let currentSport = "soccer_epl";
let allGames = [];
let selections = [];


/* =========================================================
   ELEMENTS
   ========================================================= */

const gamesContainer = document.getElementById("gamesContainer");
const statusBox = document.getElementById("status");
const refreshBtn = document.getElementById("refreshBtn");
const searchInput = document.getElementById("searchInput");

const loginBtn = document.getElementById("loginBtn");
const registerBtn = document.getElementById("registerBtn");

const loginModal = document.getElementById("loginModal");
const registerModal = document.getElementById("registerModal");

const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");

const authButtons = document.getElementById("authButtons");
const userBar = document.getElementById("userBar");
const userName = document.getElementById("userName");
const logoutBtn = document.getElementById("logoutBtn");

const betSlip = document.getElementById("betSlip");
const slipFloating = document.getElementById("slipFloating");
const closeSlip = document.getElementById("closeSlip");

const slipBody = document.getElementById("slipBody");
const slipCount = document.getElementById("slipCount");
const floatingCount = document.getElementById("floatingCount");
const totalOdds = document.getElementById("totalOdds");
const selectionCount = document.getElementById("selectionCount");

const demoBetBtn = document.getElementById("demoBetBtn");


/* =========================================================
   API FETCH WITH TIMEOUT
   ========================================================= */

async function apiFetch(path, options = {}) {

  const controller = new AbortController();

  const timeout = setTimeout(() => {
    controller.abort();
  }, REQUEST_TIMEOUT);

  try {

    const token = localStorage.getItem("quora_token");

    const headers = {
      "Content-Type": "application/json",
      ...(options.headers || {})
    };

    if (token) {
      headers.Authorization = `Bearer ${token}`;
    }

    const response = await fetch(
      API_BASE + path,
      {
        ...options,
        headers,
        signal: controller.signal
      }
    );

    let data = null;

    try {
      data = await response.json();
    } catch {
      data = {};
    }

    if (!response.ok) {

      throw new Error(
        data.error ||
        `Server returned HTTP ${response.status}`
      );
    }

    return data;

  } catch (error) {

    if (error.name === "AbortError") {
      throw new Error(
        "The backend took too long to respond. Render may be waking up. Tap Refresh and try again."
      );
    }

    throw error;

  } finally {

    clearTimeout(timeout);

  }
}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(message, type = "") {

  statusBox.className = "status " + type;

  statusBox.textContent = "● " + message;

}


/* =========================================================
   LOAD GAMES
   ========================================================= */

async function loadGames() {

  refreshBtn.disabled = true;
  refreshBtn.textContent = "↻ Loading...";

  setStatus(
    "Connecting to Quora Bets...",
    "loading"
  );

  gamesContainer.innerHTML = `
    <div class="empty">
      <h2>Loading games...</h2>
      <p>Connecting to the odds service.</p>
    </div>
  `;

  try {

    /*
      Your backend endpoint:
      GET /api/odds?sport=soccer_epl
    */

    const data = await apiFetch(
      `/api/odds?sport=${encodeURIComponent(currentSport)}`
    );

    if (!data || !Array.isArray(data.games)) {

      throw new Error(
        "The backend returned an invalid games response."
      );

    }

    allGames = data.games;

    if (allGames.length === 0) {

      setStatus(
        "Connected — no upcoming games found for this sport.",
        ""
      );

      gamesContainer.innerHTML = `
        <div class="empty">
          <h2>No games available</h2>
          <p>
            There are currently no upcoming matches for this sport.
          </p>
        </div>
      `;

      return;
    }

    setStatus(
      `Connected — ${allGames.length} game${allGames.length === 1 ? "" : "s"} loaded`,
      ""
    );

    renderGames();

  } catch (error) {

    console.error("LOAD GAMES ERROR:", error);

    setStatus(
      "Connection error",
      "error"
    );

    gamesContainer.innerHTML = `
      <div class="empty">

        <h2>Unable to load games</h2>

        <p style="margin-bottom:20px;">
          ${escapeHtml(error.message)}
        </p>

        <button
          class="btn btn-primary"
          onclick="loadGames()"
        >
          Try Again
        </button>

      </div>
    `;

  } finally {

    refreshBtn.disabled = false;
    refreshBtn.textContent = "↻ Refresh";

  }

}


/* =========================================================
   RENDER GAMES
   ========================================================= */

function renderGames() {

  const query = searchInput.value
    .trim()
    .toLowerCase();

  const filtered = allGames.filter(game => {

    if (!query) return true;

    return (
      String(game.home_team || "")
        .toLowerCase()
        .includes(query) ||

      String(game.away_team || "")
        .toLowerCase()
        .includes(query)
    );

  });

  if (filtered.length === 0) {

    gamesContainer.innerHTML = `
      <div class="empty">
        <h2>No matching games</h2>
        <p>Try another team name.</p>
      </div>
    `;

    return;
  }

  /*
    Group by league/sport title.
  */

  const groups = {};

  filtered.forEach(game => {

    const league =
      game.sport_title ||
      game.sport_key ||
      "Games";

    if (!groups[league]) {
      groups[league] = [];
    }

    groups[league].push(game);

  });

  gamesContainer.innerHTML = Object.entries(groups)
    .map(([league, games]) => {

      return `
        <section class="league">

          <div class="league-title">

            <span>🏆 ${escapeHtml(league)}</span>

            <span>
              ${games.length} match${games.length === 1 ? "" : "es"}
            </span>

          </div>

          ${games.map(renderMatch).join("")}

        </section>
      `;

    })
    .join("");

}


/* =========================================================
   RENDER MATCH
   ========================================================= */

function renderMatch(game) {

  const bookmakers = game.bookmakers || [];

  let outcomes = [];

  /*
    Find first h2h market.
  */

  for (const bookmaker of bookmakers) {

    for (const market of bookmaker.markets || []) {

      if (market.key === "h2h") {

        outcomes = market.outcomes || [];

        break;

      }

    }

    if (outcomes.length) break;

  }

  const homeOutcome = outcomes.find(
    x => x.name === game.home_team
  );

  const awayOutcome = outcomes.find(
    x => x.name === game.away_team
  );

  const drawOutcome = outcomes.find(
    x => String(x.name).toLowerCase() === "draw"
  );

  const date = game.commence_time
    ? new Date(game.commence_time).toLocaleString()
    : "Time unavailable";

  return `

    <article class="match">

      <div class="match-top">

        <span>
          ${escapeHtml(date)}
        </span>

        <span class="upcoming">
          ● UPCOMING
        </span>

      </div>

      <div class="teams">

        ${escapeHtml(game.home_team || "Home")}

        <span class="vs">VS</span>

        ${escapeHtml(game.away_team || "Away")}

      </div>

      <div class="odds">

        ${renderOdd(
          game,
          homeOutcome,
          game.home_team
        )}

        ${renderOdd(
          game,
          drawOutcome,
          "Draw"
        )}

        ${renderOdd(
          game,
          awayOutcome,
          game.away_team
        )}

      </div>

    </article>
  `;
}


/* =========================================================
   ODD BUTTON
   ========================================================= */

function renderOdd(game, outcome, label) {

  if (!outcome) {

    return `
      <button
        class="odd"
        disabled
        style="opacity:.45;cursor:not-allowed;"
      >
        <span class="odd-name">
          ${escapeHtml(label)}
        </span>

        <span class="odd-price">
          -
        </span>
      </button>
    `;

  }

  const price = Number(outcome.price);

  return `

    <button
      class="odd"
      onclick="addSelection(
        ${JSON.stringify(game).replace(/"/g, "&quot;")},
        ${JSON.stringify(outcome).replace(/"/g, "&quot;")}
      )"
    >

      <span class="odd-name">
        ${escapeHtml(label)}
      </span>

      <span class="odd-price">
        ${Number.isFinite(price) ? price.toFixed(2) : "-"}
      </span>

    </button>
  `;
}


/* =========================================================
   ADD SELECTION
   ========================================================= */

function addSelection(game, outcome) {

  const existingIndex = selections.findIndex(
    s =>
      s.eventId === game.id &&
      s.outcomeName === outcome.name
  );

  /*
    Remove if already selected.
  */

  if (existingIndex !== -1) {

    selections.splice(existingIndex, 1);

  } else {

    /*
      Only one selection per event.
    */

    selections = selections.filter(
      s => s.eventId !== game.id
    );

    selections.push({

      eventId: String(game.id),

      sportKey:
        game.sport_key ||
        currentSport,

      homeTeam:
        game.home_team,

      awayTeam:
        game.away_team,

      commenceTime:
        game.commence_time,

      outcomeName:
        outcome.name,

      odds:
        Number(outcome.price)

    });

  }

  updateSlip();

  /*
    Open the slip automatically.
  */

  if (selections.length > 0) {

    betSlip.classList.add("open");
    slipFloating.style.display = "none";

  } else {

    betSlip.classList.remove("open");

  }

}


/* =========================================================
   UPDATE BET SLIP
   ========================================================= */

function updateSlip() {

  const count = selections.length;

  slipCount.textContent = count;
  floatingCount.textContent = count;
  selectionCount.textContent = count;

  if (count === 0) {

    totalOdds.textContent = "0.00";

    slipBody.innerHTML = `
      <div class="empty" style="padding:30px 10px;">
        Your bet slip is empty.
      </div>
    `;

    slipFloating.style.display = "none";

    return;

  }

  let odds = 1;

  slipBody.innerHTML = selections.map(
    (selection, index) => {

      odds *= Number(selection.odds);

      return `
        <div class="slip-item">

          <strong>
            ${escapeHtml(selection.homeTeam)}
            vs
            ${escapeHtml(selection.awayTeam)}
          </strong>

          <small>
            ${escapeHtml(selection.outcomeName)}
            @
            ${Number(selection.odds).toFixed(2)}
          </small>

          <br>

          <button
            class="remove"
            onclick="removeSelection(${index})"
          >
            Remove
          </button>

        </div>
      `;

    }
  ).join("");

  totalOdds.textContent = odds.toFixed(2);

  slipFloating.style.display = "block";

}


/* =========================================================
   REMOVE SELECTION
   ========================================================= */

function removeSelection(index) {

  selections.splice(index, 1);

  updateSlip();

}

/* =========================================================
   REGISTER
   ========================================================= */

registerForm.addEventListener("submit", async event => {

  event.preventDefault();

  const message =
    document.getElementById("registerMessage");

  message.style.color = "#ffd86b";
  message.textContent = "Creating account...";

  try {

    const data = await apiFetch(
      "/api/auth/register",
      {
        method: "POST",

        body: JSON.stringify({

          name:
            document.getElementById("registerName").value,

          email:
            document.getElementById("registerEmail").value,

          phone:
            document.getElementById("registerPhone").value,

          password:
            document.getElementById("registerPassword").value

        })

      }
    );

    if (!data.token) {
      throw new Error("Registration succeeded but no token was returned.");
    }

    localStorage.setItem(
      "quora_token",
      data.token
    );

    localStorage.setItem(
      "quora_user",
      JSON.stringify(data.user)
    );

    message.style.color = "#16d968";
    message.textContent = "Account created successfully.";

    setTimeout(() => {

      registerModal.classList.remove("open");

      updateAuthUI();

    }, 700);

  } catch (error) {

    console.error("REGISTER:", error);

    message.style.color = "#ff7777";
    message.textContent = error.message;

  }

});

/* =========================================================
   AUTH UI
   ========================================================= */

function updateAuthUI() {

  const token =
    localStorage.getItem("quora_token");

  const savedUser =
    localStorage.getItem("quora_user");

  if (token && savedUser) {

    try {

      const user = JSON.parse(savedUser);

      authButtons.style.display = "none";
      userBar.classList.add("show");

      userName.textContent =
        user.name ||
        user.email ||
        "Account";

    } catch {

      localStorage.removeItem("quora_token");
      localStorage.removeItem("quora_user");

    }

  } else {

    authButtons.style.display = "flex";
    userBar.classList.remove("show");

  }

}

/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}
